extends: default

yaml-files:
  - "*.yaml"
  - "*.yml"
  - "*.rules"

ignore: |
  helm/ferry/templates/
  kolla-ansible/ansible/roles/ferry/files/prometheus/50-ferry.yml
  .venv*/
  dist/

rules:
  line-length: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
    ignore: |
      kolla-ansible/etc/globals.yml
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  indentation:
    spaces: consistent
    indent-sequences: whatever
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
