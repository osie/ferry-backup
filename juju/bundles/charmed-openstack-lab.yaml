default-base: ubuntu@24.04/stable
machines:
  "0":
    constraints: virt-type=virtual-machine cores=4 mem=7G root-disk=40G
  "1":
    constraints: virt-type=virtual-machine cores=2 mem=3G root-disk=40G
applications:
  mysql-innodb-cluster:
    charm: mysql-innodb-cluster
    channel: 8.0/stable
    num_units: 3
    options:
      max-connections: 1000
      innodb-buffer-pool-size: 256M
  rabbitmq-server:
    charm: rabbitmq-server
    channel: 3.9/stable
    base: ubuntu@22.04/stable
    num_units: 1
  keystone:
    charm: keystone
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: distro
      admin-password: openstack
      worker-multiplier: 0.25
  keystone-mysql-router:
    charm: mysql-router
    channel: 8.0/stable
  glance:
    charm: glance
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: distro
      worker-multiplier: 0.25
  glance-mysql-router:
    charm: mysql-router
    channel: 8.0/stable
  placement:
    charm: placement
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: distro
      worker-multiplier: 0.25
  placement-mysql-router:
    charm: mysql-router
    channel: 8.0/stable
  nova-cloud-controller:
    charm: nova-cloud-controller
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: distro
      network-manager: Neutron
      worker-multiplier: 0.25
  nova-cloud-controller-mysql-router:
    charm: mysql-router
    channel: 8.0/stable
  nova-compute:
    charm: nova-compute
    channel: 2024.1/stable
    num_units: 1
    to: ["0"]
    options:
      openstack-origin: distro
      virt-type: qemu
      enable-live-migration: false
      enable-resize: false
  neutron-api:
    charm: neutron-api
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: distro
      manage-neutron-plugin-legacy-mode: true
      overlay-network-type: vxlan
      worker-multiplier: 0.25
  neutron-api-mysql-router:
    charm: mysql-router
    channel: 8.0/stable
  neutron-openvswitch:
    charm: neutron-openvswitch
    channel: 2024.1/stable
    options:
      enable-local-dhcp-and-metadata: true
  cinder:
    charm: cinder
    channel: 2024.1/stable
    num_units: 1
    options:
      openstack-origin: distro
      block-device: None
      glance-api-version: 2
      worker-multiplier: 0.25
  cinder-mysql-router:
    charm: mysql-router
    channel: 8.0/stable
  cinder-ceph:
    charm: cinder-ceph
    channel: 2024.1/stable
    options:
      ceph-osd-replication-count: 1
  ceph-mon:
    charm: ceph-mon
    channel: squid/stable
    num_units: 1
    options:
      monitor-count: 1
      expected-osd-count: 1
      source: distro
  ceph-osd:
    charm: ceph-osd
    channel: squid/stable
    num_units: 1
    to: ["1"]
    storage:
      osd-devices: loop,20G,1
    options:
      source: distro
relations:
  - [keystone:shared-db, keystone-mysql-router:shared-db]
  - [keystone-mysql-router:db-router, mysql-innodb-cluster:db-router]
  - [glance:shared-db, glance-mysql-router:shared-db]
  - [glance-mysql-router:db-router, mysql-innodb-cluster:db-router]
  - [glance:identity-service, keystone:identity-service]
  - [placement:shared-db, placement-mysql-router:shared-db]
  - [placement-mysql-router:db-router, mysql-innodb-cluster:db-router]
  - [placement:identity-service, keystone:identity-service]
  - [placement:placement, nova-cloud-controller:placement]
  - [nova-cloud-controller:shared-db, nova-cloud-controller-mysql-router:shared-db]
  - [nova-cloud-controller-mysql-router:db-router, mysql-innodb-cluster:db-router]
  - [nova-cloud-controller:identity-service, keystone:identity-service]
  - [nova-cloud-controller:amqp, rabbitmq-server:amqp]
  - [nova-cloud-controller:image-service, glance:image-service]
  - [nova-cloud-controller:neutron-api, neutron-api:neutron-api]
  - [nova-cloud-controller:cloud-compute, nova-compute:cloud-compute]
  - [nova-compute:amqp, rabbitmq-server:amqp]
  - [nova-compute:image-service, glance:image-service]
  - [nova-compute:neutron-plugin, neutron-openvswitch:neutron-plugin]
  - [nova-compute:ceph-access, cinder-ceph:ceph-access]
  - [neutron-api:shared-db, neutron-api-mysql-router:shared-db]
  - [neutron-api-mysql-router:db-router, mysql-innodb-cluster:db-router]
  - [neutron-api:identity-service, keystone:identity-service]
  - [neutron-api:amqp, rabbitmq-server:amqp]
  - [neutron-api:neutron-plugin-api, neutron-openvswitch:neutron-plugin-api]
  - [neutron-openvswitch:amqp, rabbitmq-server:amqp]
  - [cinder:shared-db, cinder-mysql-router:shared-db]
  - [cinder-mysql-router:db-router, mysql-innodb-cluster:db-router]
  - [cinder:identity-service, keystone:identity-service]
  - [cinder:amqp, rabbitmq-server:amqp]
  - [cinder:image-service, glance:image-service]
  - [cinder:storage-backend, cinder-ceph:storage-backend]
  - [cinder-ceph:ceph, ceph-mon:client]
  - [ceph-osd:mon, ceph-mon:osd]
