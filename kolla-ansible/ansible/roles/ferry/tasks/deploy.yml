---
# Before anything else: a fabric mover cannot attach a volume without its
# kernel modules and its initiator identity, and discovering that at the first
# restore is six months too late.
- name: Configure the hosts
  ansible.builtin.import_tasks: config-host.yml

- name: Generate Ferry's PKI
  ansible.builtin.import_tasks: pki.yml

- name: Register ferry in Keystone
  ansible.builtin.import_tasks: register.yml

# After register.yml: an application credential is created BY the service user
# FOR itself, so that user has to exist and hold the roles first.
- name: Mint ferry's application credential
  ansible.builtin.import_tasks: appcred.yml

# Before config.yml, which renders the manager's objects stanza from it.
- name: Load ferry's RGW gateway credential
  ansible.builtin.import_tasks: objects.yml

- name: Configure ferry
  ansible.builtin.import_tasks: config.yml

- name: Create the ferry database
  ansible.builtin.import_tasks: bootstrap.yml

- name: Check ferry containers
  ansible.builtin.import_tasks: check-containers.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
