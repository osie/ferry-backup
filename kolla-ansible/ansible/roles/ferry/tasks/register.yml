---
# Ferry appears in this cloud's own catalog as service type "backup",
# so a tenant reaches their own cloud's Ferry with a normal token and finds it
# the way they find Cinder.
- name: Register ferry service, endpoints and users in Keystone
  ansible.builtin.import_role:
    name: service-ks-register
  vars:
    service_ks_register_auth: "{{ openstack_ferry_auth }}"
    service_ks_register_services: "{{ ferry_ks_services }}"
    service_ks_register_users: "{{ ferry_ks_users }}"
    service_ks_register_user_roles: "{{ ferry_ks_user_roles }}"
