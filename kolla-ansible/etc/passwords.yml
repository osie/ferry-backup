# Append to /etc/kolla/passwords.yml, then run `kolla-genpwd` to fill them.
#
#   cat kolla-ansible/etc/passwords.yml >> /etc/kolla/passwords.yml
#   kolla-genpwd
#
# No leading `---`. That is not tidiness: appending a document marker to an
# existing passwords.yml makes it a TWO-document stream, and kolla-genpwd
# refuses it with "expected a single document in the stream" — after the
# operator has already followed the instruction above.
#
# Three, and no more. Ferry's fourth secret — the KEK — is deliberately NOT
# here: a key that decrypts every backup should not be minted by a password
# generator, and a regenerated one is a repository nobody can read. It lives in
# Barbican and is provisioned once by kolla-ansible/tools/create-kek.sh.

# The manager's MariaDB user. It is the only Ferry component with a database
# credential at all — movers hold none by design.
#
# It ends up inside a go-sql-driver DSN of the form
# user:pass@tcp(host:port)/db, which has no escaping: a password containing @
# or / would break it. kolla-genpwd produces alphanumerics, so this is fine as
# generated and is a thing to know before setting one by hand.
ferry_database_password:

# Ferry's Keystone service user. Used to create Ferry's application credential
# and then to nothing else — the deployed manager never sees it.
ferry_keystone_password:

# The secret of that application credential. Supplied rather than
# generated by Keystone, because Keystone has no way to re-read a secret and
# the ansible module recreates an application credential on every run: a
# supplied secret means recreating it does not invalidate what is deployed.
ferry_keystone_appcred_secret:
