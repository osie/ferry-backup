# Ferry's records in the shape kolla's OpenSearch index expects.
#
# Copy this file to /etc/kolla/config/fluentd/filter/ next to
# input/20-ferry.conf. The tag is ferry.var.log.kolla.ferry.<file>.log, so
# tag_parts[5] is the file name — ferry-manager, ferry-mover or ferry-compute —
# which is what every other service reports as programname. Ferry's own keys
# (msg, level, job_id, request_id, …) stay on the record, so a job can still be
# followed by its id.
<filter ferry.**>
  @type record_transformer
  <record>
    Hostname ${hostname}
    Logger ferry
    programname ${tag_parts[5]}
    log_level ${record["level"]}
    Payload ${record["msg"]}
  </record>
</filter>
