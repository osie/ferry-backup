# Ferry's logs, for kolla's fluentd.
#
# Copy this file to /etc/kolla/config/fluentd/input/ and run
#   kolla-ansible reconfigure -i <inventory> --tags common
# kolla's common role installs every *.conf it finds there and restarts fluentd
# where the configuration changed.
#
# kolla's own input tails a fixed list of OpenStack service directories under
# /var/log/kolla, so a directory it has never heard of needs an input of its own.
# The records are JSON (log/slog), which fluentd parses natively; the tag is
# Ferry's own so kolla's programname rewrite, which drops what it does not
# recognise into "unmatched", never sees them. filter/20-ferry.conf gives the
# records the field names kolla's dashboards expect.
<source>
  @type tail
  path /var/log/kolla/ferry/*.log
  pos_file /var/run/fluentd/ferry.pos
  tag ferry.*
  ignore_repeated_permission_error true
  enable_watch_timer false
  <parse>
    @type json
    time_key time
    time_type string
    time_format %iso8601
    keep_time_key true
  </parse>
</source>
