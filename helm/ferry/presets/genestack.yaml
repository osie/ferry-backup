database:
  host: mariadb-cluster-primary.openstack.svc.cluster.local
  bootstrap:
    enabled: true
    admin:
      user: root
      secretName: mariadb
      secretKey: root-password

keystone:
  authUrl: http://keystone-api.openstack.svc.cluster.local:5000/v3
  userDomain: default
  projectDomain: default
  bootstrap:
    enabled: true
    adminSecret: keystone-keystone-admin

ceph:
  conf:
    configMap: ceph-etc
  keyrings:
    bootstrap:
      enabled: true
      adminSecret: pvc-ceph-client-key
      adminKey: key
  volumeNameTemplate: "%s"

compute:
  nodeSelector:
    openstack-compute-node: enabled
  libvirt:
    runDir: /run/libvirt
    socket: libvirt-sock
  qemu:
    uid: 42424
    gid: 42424

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: "{{ include \"ferry.apiService\" . }}"
    spec:
      parentRefs:
        - name: flex-gateway
          namespace: envoy-gateway
          sectionName: http
      hostnames:
        - "{{ .Values.api.ingress.host }}"
      rules:
        - backendRefs:
            - name: "{{ include \"ferry.apiService\" . }}"
              port: 9776
