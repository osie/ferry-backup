{{- if not .Values.credentials.existingSecret }}
{{- $name := include "ferry.credentialsSecret" . }}
{{- $current := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $current = .data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ferry.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  database-password: {{ get $current "database-password" | default (randAlphaNum 32 | b64enc) | quote }}
  keystone-password: {{ get $current "keystone-password" | default (randAlphaNum 32 | b64enc) | quote }}
  application-credential-secret: {{ get $current "application-credential-secret" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- if .Values.database.embedded.enabled }}
  database-root-password: {{ get $current "database-root-password" | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
{{- end }}
